name: Build va deploy website

# Moi push/PR: cai dat, build Nuxt.
# Push len main: them buoc deploy len VPS:
#   1. Gui BI MAT (GitHub Secrets) + BIEN (GitHub Variables) qua STDIN cua ssh ->
#      VPS gop vao /etc/htbb/htbb.env (systemd nap bang EnvironmentFile).
#   2. Gui ban build (.output nen tar.gz) qua STDIN -> VPS giai nen vao
#      /opt/htbb/web/releases/<sha>, tro symlink /opt/htbb/web/.output sang do, restart htbb-web.
#
# Dia chi VPS lay tu bien repo HTBB_VPS_HOST (Settings > Variables) - KHONG ghi IP vao git.
# Moi bien moi truong HTBB_* deu lay tu GitHub Secrets/Variables va day sang VPS nay.
#   - Secret/Variable DE TRONG thi VPS GIU NGUYEN gia tri dang co (khong xoa).
#   - HTBB_DB_*: de TRONG neu muon web tu doc ket noi CSDL tu server.ini cua game
#     (HTBB_SERVER_DIR) - dat sai (vd. gia tri cua VPS cu) la web dung sai CSDL.
#
# Khoa SSH rieng cho web (secret VPS_SSH_KEY_WEB_2), bi ep chay DUNG MOT lenh
# (command="/usr/local/sbin/htbb-deploy-web.sh" trong authorized_keys, cai bang
# web/deploy/cai-dat-vps.sh). Lenh ssh
# chi chon "viec" (nhan-env / nhan-build) qua SSH_ORIGINAL_COMMAND, script tren VPS
# chi nhan dung hai tu do. Xem deploy/deploy-web.sh.
#
# Secret nao DE TRONG thi VPS GIU NGUYEN gia tri dang co (khong xoa) - quen dat
# mot secret khong lam sap website.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-deploy.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web   # monorepo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cai dat
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dong goi
        run: tar -czf htbb-web-build.tgz .output

      - uses: actions/upload-artifact@v7
        with:
          name: htbb-web-build
          path: web/htbb-web-build.tgz
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ten: vps-moi
            host_var: HTBB_VPS_HOST
            khoa: VPS_SSH_KEY_WEB_2
            gui_env: true
            bat_buoc: true
    name: deploy (${{ matrix.ten }})
    env:
      VPS_HOST: ${{ vars[matrix.host_var] }}
    steps:
      - name: Cai khoa SSH
        id: khoa
        env:
          KHOA: ${{ secrets[matrix.khoa] }}
          TEN_KHOA: ${{ matrix.khoa }}
          BAT_BUOC: ${{ matrix.bat_buoc }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::error::Chua co bien repo HTBB_VPS_HOST (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "$KHOA" ]; then
            if [ "$BAT_BUOC" = "true" ]; then
              echo "::error::Chua co secret $TEN_KHOA. Xem README muc 'Deploy len VPS'."
              exit 1
            fi
            echo "::warning::Chua co secret $TEN_KHOA -> bo qua deploy len $VPS_HOST."
            echo "co=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KHOA" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if ! ssh-keygen -y -f ~/.ssh/deploy_key -P "" > /dev/null 2>&1; then
            echo "::error::Secret $TEN_KHOA khong doc duoc (dinh dang private key bi hong - dan lai TOAN BO noi dung, giu nguyen xuong dong)."
            exit 1
          fi
          echo "co=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.khoa.outputs.co == 'true'
        with:
          name: htbb-web-build

      - name: Gui bien moi truong
        if: steps.khoa.outputs.co == 'true' && matrix.gui_env
        # Bi mat lay tu Settings > Secrets and variables > Actions > Secrets,
        # gia tri khong nhay cam (link tai game...) lay tu tab Variables.
        # KHONG echo gia tri ra log.
        env:
          HTBB_SECRET: ${{ secrets.HTBB_SECRET || secrets.KPAH_SECRET }}  # TUONG-THICH-TEN-CU
          HTBB_DB_HOST: ${{ secrets.HTBB_DB_HOST || secrets.KPAH_DB_HOST }}  # TUONG-THICH-TEN-CU
          HTBB_DB_PORT: ${{ secrets.HTBB_DB_PORT || secrets.KPAH_DB_PORT }}  # TUONG-THICH-TEN-CU
          HTBB_DB_USER: ${{ secrets.HTBB_DB_USER || secrets.KPAH_DB_USER }}  # TUONG-THICH-TEN-CU
          HTBB_DB_PASS: ${{ secrets.HTBB_DB_PASS || secrets.KPAH_DB_PASS }}  # TUONG-THICH-TEN-CU
          HTBB_DB_GAME: ${{ secrets.HTBB_DB_GAME || secrets.KPAH_DB_GAME }}  # TUONG-THICH-TEN-CU
          HTBB_DB_ACCOUNT: ${{ secrets.HTBB_DB_ACCOUNT || secrets.KPAH_DB_ACCOUNT }}  # TUONG-THICH-TEN-CU
          HTBB_DB_ACCOUNT_USER: ${{ secrets.HTBB_DB_ACCOUNT_USER || secrets.KPAH_DB_ACCOUNT_USER }}  # TUONG-THICH-TEN-CU
          HTBB_DB_ACCOUNT_PASS: ${{ secrets.HTBB_DB_ACCOUNT_PASS || secrets.KPAH_DB_ACCOUNT_PASS }}  # TUONG-THICH-TEN-CU
          HTBB_TPBANK_ACCOUNT_NO: ${{ secrets.HTBB_TPBANK_ACCOUNT_NO || secrets.KPAH_TPBANK_ACCOUNT_NO }}  # TUONG-THICH-TEN-CU
          HTBB_TPBANK_ACCOUNT_NAME: ${{ secrets.HTBB_TPBANK_ACCOUNT_NAME || secrets.KPAH_TPBANK_ACCOUNT_NAME }}  # TUONG-THICH-TEN-CU
          HTBB_SEPAY_WEBHOOK_APIKEY: ${{ secrets.HTBB_SEPAY_WEBHOOK_APIKEY || secrets.KPAH_SEPAY_WEBHOOK_APIKEY }}  # TUONG-THICH-TEN-CU
          HTBB_ADMIN_NAPTIEN_PASSWORD: ${{ secrets.HTBB_ADMIN_NAPTIEN_PASSWORD || secrets.KPAH_ADMIN_NAPTIEN_PASSWORD }}  # TUONG-THICH-TEN-CU
          HTBB_ADMIN_ACCOUNTS: ${{ secrets.HTBB_ADMIN_ACCOUNTS || secrets.KPAH_ADMIN_ACCOUNTS }}  # TUONG-THICH-TEN-CU
          HTBB_ADMIN_2FA_BAT_BUOC: ${{ vars.HTBB_ADMIN_2FA_BAT_BUOC || vars.KPAH_ADMIN_2FA_BAT_BUOC }}  # TUONG-THICH-TEN-CU
          HTBB_ADMIN_IDLE_TIMEOUT: ${{ vars.HTBB_ADMIN_IDLE_TIMEOUT || vars.KPAH_ADMIN_IDLE_TIMEOUT }}  # TUONG-THICH-TEN-CU
          HTBB_ADMIN_MAX_FAIL: ${{ vars.HTBB_ADMIN_MAX_FAIL || vars.KPAH_ADMIN_MAX_FAIL }}  # TUONG-THICH-TEN-CU
          HTBB_ADMIN_FAIL_WINDOW: ${{ vars.HTBB_ADMIN_FAIL_WINDOW || vars.KPAH_ADMIN_FAIL_WINDOW }}  # TUONG-THICH-TEN-CU
          HTBB_SERVER_DIR: ${{ vars.HTBB_SERVER_DIR || vars.KPAH_SERVER_DIR }}  # TUONG-THICH-TEN-CU
          HTBB_TRUSTED_PROXIES: ${{ vars.HTBB_TRUSTED_PROXIES || vars.KPAH_TRUSTED_PROXIES }}  # TUONG-THICH-TEN-CU
          HTBB_LINK_ANDROID: ${{ vars.HTBB_LINK_ANDROID || vars.KPAH_LINK_ANDROID }}  # TUONG-THICH-TEN-CU
          HTBB_LINK_PC: ${{ vars.HTBB_LINK_PC || vars.KPAH_LINK_PC }}  # TUONG-THICH-TEN-CU
          HTBB_LINK_IOS: ${{ vars.HTBB_LINK_IOS || vars.KPAH_LINK_IOS }}  # TUONG-THICH-TEN-CU
          HTBB_LINK_JAR: ${{ vars.HTBB_LINK_JAR || vars.KPAH_LINK_JAR }}  # TUONG-THICH-TEN-CU
          HTBB_LINK_GROUP: ${{ vars.HTBB_LINK_GROUP || vars.KPAH_LINK_GROUP }}  # TUONG-THICH-TEN-CU
          HTBB_SITE_URL: ${{ vars.HTBB_SITE_URL || vars.KPAH_SITE_URL }}  # TUONG-THICH-TEN-CU
          HTBB_AUTO_ACTIVATE: ${{ vars.HTBB_AUTO_ACTIVATE || vars.KPAH_AUTO_ACTIVATE }}  # TUONG-THICH-TEN-CU
          HTBB_NAP_BAT: ${{ vars.HTBB_NAP_BAT || vars.KPAH_NAP_BAT }}  # TUONG-THICH-TEN-CU
          NAP_DA_CO_GIAY_PHEP: ${{ vars.NAP_DA_CO_GIAY_PHEP }}
          HTBB_NAP_ACCOUNT_NO: ${{ secrets.HTBB_NAP_ACCOUNT_NO || secrets.KPAH_NAP_ACCOUNT_NO }}  # TUONG-THICH-TEN-CU
          HTBB_NAP_ACCOUNT_NAME: ${{ secrets.HTBB_NAP_ACCOUNT_NAME || secrets.KPAH_NAP_ACCOUNT_NAME }}  # TUONG-THICH-TEN-CU
          HTBB_NAP_BANK_BIN: ${{ vars.HTBB_NAP_BANK_BIN || vars.KPAH_NAP_BANK_BIN }}  # TUONG-THICH-TEN-CU
          HTBB_SEPAY_API_TOKEN: ${{ secrets.HTBB_SEPAY_API_TOKEN || secrets.KPAH_SEPAY_API_TOKEN }}  # TUONG-THICH-TEN-CU
          HTBB_SEPAY_DO_PHUT: ${{ vars.HTBB_SEPAY_DO_PHUT || vars.KPAH_SEPAY_DO_PHUT }}  # TUONG-THICH-TEN-CU
          HTBB_SEPAY_DO_GIO: ${{ vars.HTBB_SEPAY_DO_GIO || vars.KPAH_SEPAY_DO_GIO }}  # TUONG-THICH-TEN-CU
          HTBB_CASSO_WEBHOOK_SECRET: ${{ secrets.HTBB_CASSO_WEBHOOK_SECRET || secrets.KPAH_CASSO_WEBHOOK_SECRET }}  # TUONG-THICH-TEN-CU
          HTBB_GMAIL_CLIENT_ID: ${{ secrets.HTBB_GMAIL_CLIENT_ID || secrets.KPAH_GMAIL_CLIENT_ID }}  # TUONG-THICH-TEN-CU
          HTBB_GMAIL_CLIENT_SECRET: ${{ secrets.HTBB_GMAIL_CLIENT_SECRET || secrets.KPAH_GMAIL_CLIENT_SECRET }}  # TUONG-THICH-TEN-CU
          HTBB_GMAIL_REFRESH_TOKEN: ${{ secrets.HTBB_GMAIL_REFRESH_TOKEN || secrets.KPAH_GMAIL_REFRESH_TOKEN }}  # TUONG-THICH-TEN-CU
          HTBB_GMAIL_SENDER: ${{ secrets.HTBB_GMAIL_SENDER || secrets.KPAH_GMAIL_SENDER }}  # TUONG-THICH-TEN-CU
          HTBB_MAIL_FROM_NAME: ${{ vars.HTBB_MAIL_FROM_NAME || vars.KPAH_MAIL_FROM_NAME }}  # TUONG-THICH-TEN-CU
          # Danh sach may chu cho client game (/server.txt), mot dong; nhieu may chu ngan bang "\n".
          HTBB_SERVER_LIST: ${{ vars.HTBB_SERVER_LIST }}
          # Rieng link danh sach cu cho client cu da phat hanh (trong = dung chung HTBB_SERVER_LIST).
          HTBB_SERVER_LIST_CU: ${{ vars.HTBB_SERVER_LIST_CU || vars.HTBB_NQSH_LIST }}  # TUONG-THICH-TEN-CU
        run: |
          goi=""
          for k in HTBB_SECRET HTBB_DB_HOST HTBB_DB_PORT HTBB_DB_USER HTBB_DB_PASS HTBB_DB_GAME \
                   HTBB_DB_ACCOUNT HTBB_DB_ACCOUNT_USER HTBB_DB_ACCOUNT_PASS \
                   HTBB_TPBANK_ACCOUNT_NO HTBB_TPBANK_ACCOUNT_NAME HTBB_SEPAY_WEBHOOK_APIKEY \
                   HTBB_ADMIN_NAPTIEN_PASSWORD HTBB_ADMIN_ACCOUNTS HTBB_ADMIN_2FA_BAT_BUOC \
                   HTBB_ADMIN_IDLE_TIMEOUT HTBB_ADMIN_MAX_FAIL HTBB_ADMIN_FAIL_WINDOW \
                   HTBB_SERVER_DIR HTBB_TRUSTED_PROXIES \
                   HTBB_LINK_ANDROID HTBB_LINK_PC HTBB_LINK_IOS HTBB_LINK_JAR HTBB_LINK_GROUP HTBB_SITE_URL HTBB_AUTO_ACTIVATE HTBB_NAP_BAT \
                   NAP_DA_CO_GIAY_PHEP HTBB_NAP_ACCOUNT_NO HTBB_NAP_ACCOUNT_NAME HTBB_NAP_BANK_BIN \
                   HTBB_SEPAY_API_TOKEN HTBB_SEPAY_DO_PHUT HTBB_SEPAY_DO_GIO HTBB_CASSO_WEBHOOK_SECRET \
                   HTBB_GMAIL_CLIENT_ID HTBB_GMAIL_CLIENT_SECRET HTBB_GMAIL_REFRESH_TOKEN \
                   HTBB_GMAIL_SENDER HTBB_MAIL_FROM_NAME HTBB_SERVER_LIST HTBB_SERVER_LIST_CU; do
            v=${!k-}
            # Gia tri nhieu dong se pha dinh dang KEY=VALUE -> tu choi ngay o day.
            case "$v" in *$'\n'*) echo "::error::$k chua xuong dong, khong hop le"; exit 1 ;; esac
            if [ -n "$v" ]; then
              goi="$goi$k=$v"$'\n'
            fi
          done
          printf '%s' "$goi" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes root@"$VPS_HOST" nhan-env

      - name: Gui ban build va khoi dong lai
        if: steps.khoa.outputs.co == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes root@"$VPS_HOST" "nhan-build ${GITHUB_SHA}" < htbb-web-build.tgz

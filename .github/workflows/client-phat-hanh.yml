# Phát hành bản mới (PC / Android / jar) lên GitHub Releases của repo public kpah-server/nqsh-h2-tai
# bằng nút "Run workflow" - không cần máy tính. Máy người chơi PC / Android tự cập nhật.
# Secrets cần có: xem phat-hanh/README.md (mục "GitHub Actions").
name: Phát hành

on:
  workflow_dispatch:
    inputs:
      loai:
        description: "Phát hành bản nào"
        type: choice
        options: [tat-ca, android, pc, jar]
        default: tat-ca
      ghi_chu:
        description: "Ghi chú hiện cho người chơi lúc cập nhật"
        default: ""
      chi_build:
        description: "Chỉ build thử (tải file ở Artifacts), KHÔNG phát hành"
        type: boolean
        default: false
      pc_kieu:
        description: "Kiểu build PC (mono = như các bản đã phát hành; il2cpp = nhanh hơn, khó dịch ngược)"
        type: choice
        options: [mono, il2cpp]
        default: mono

concurrency:
  group: phat-hanh
  cancel-in-progress: false

env:
  REPO: kpah-server/nqsh-h2-tai

jobs:
  so-ban:
    name: Lấy số bản kế tiếp
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.b.outputs.android }}
      jar: ${{ steps.b.outputs.jar }}
      pc: ${{ steps.b.outputs.pc }}
    steps:
      - name: Kiểm tra secrets
        env:
          LOAI: ${{ inputs.loai }}
          T: ${{ secrets.NQSH_TAI_TOKEN }}
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UL: ${{ secrets.UNITY_LICENSE }}
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          thieu=""
          [ -n "$T" ] || thieu="$thieu NQSH_TAI_TOKEN"
          case "$LOAI" in tat-ca|android) [ -n "$KS" ] || thieu="$thieu ANDROID_KEYSTORE_B64"; [ -n "$KP" ] || thieu="$thieu ANDROID_KEY_PASSWORD" ;; esac
          case "$LOAI" in tat-ca|pc) [ -n "$UL" ] || thieu="$thieu UNITY_LICENSE"; [ -n "$UE" ] || thieu="$thieu UNITY_EMAIL"; [ -n "$UP" ] || thieu="$thieu UNITY_PASSWORD" ;; esac
          if [ -n "$thieu" ]; then
            echo "::error::Thieu secret:$thieu (Settings -> Secrets and variables -> Actions, xem phat-hanh/README.md)"
            exit 1
          fi
          echo "Du secrets cho: $LOAI"
      - uses: actions/checkout@v7
      - id: b
        env:
          GH_TOKEN: ${{ secrets.NQSH_TAI_TOKEN }}
        run: |
          python3 -I phat-hanh/phienban.py tai-ve /tmp/pb.json
          cat /tmp/pb.json
          for l in android jar pc; do echo "$l=$(python3 -I phat-hanh/phienban.py ban-ke-tiep /tmp/pb.json $l)" >> "$GITHUB_OUTPUT"; done
          cat "$GITHUB_OUTPUT"

  android:
    name: Build Android
    needs: so-ban
    if: inputs.loai == 'tat-ca' || inputs.loai == 'android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Khóa ký APK (từ secrets)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/key
          printf '%s' "$KS" | base64 -d > /tmp/key/nqsh-h2.keystore
          printf 'keystore=nqsh-h2.keystore\nalias=nqsh-h2\npassword=%s\n' "$PASS" > /tmp/key/key.properties
      - name: Build APK (Gradle, từ source android/)
        run: |
          BAN=${{ needs.so-ban.outputs.android }} OUT=NQSH-H2-${{ needs.so-ban.outputs.android }}.apk KEY_DIR=/tmp/key sh android/build.sh
          rm -rf /tmp/key
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/out/NQSH-H2-${{ needs.so-ban.outputs.android }}.apk
          retention-days: 3

  jar:
    name: Build jar
    needs: so-ban
    if: inputs.loai == 'tat-ca' || inputs.loai == 'jar'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6    # JRE 8: rt.jar cho ProGuard
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/setup-java@v6    # JDK dùng để biên dịch (--release 8)
        with:
          distribution: temurin
          java-version: "21"
      - name: Build jar
        run: |
          RT_JAR="$JAVA_HOME_8_X64/jre/lib/rt.jar" sh j2me/build.sh ${{ needs.so-ban.outputs.jar }}
          cp "j2me/out/KPAH_276 (1)-automenu-v${{ needs.so-ban.outputs.jar }}-release.jar" NQSH-H2-v${{ needs.so-ban.outputs.jar }}.jar
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: NQSH-H2-v${{ needs.so-ban.outputs.jar }}.jar
          retention-days: 3

  pc:
    name: Build PC
    needs: so-ban
    if: inputs.loai == 'tat-ca' || inputs.loai == 'pc'
    # Bản PC build Mono (-kpahMono) giống phat-hanh.sh trên máy: bản IL2CPP (PC 16) crash ngay khi vào map,
    # và trộn hai kiểu build khiến bản cập nhật để sót file của kiểu kia.
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: pc/Library
          key: Library-Win64-${{ hashFiles('pc/Assets/**', 'pc/Packages/**', 'pc/ProjectSettings/**') }}
          restore-keys: Library-Win64-
      - uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: pc
          unityVersion: 6000.5.9f1
          targetPlatform: StandaloneWindows64
          buildMethod: BuildCli.Win64
          buildName: NQSH-H2
          buildsPath: build
          # số bản qua tham số dòng lệnh: GameCI KHÔNG chuyển biến môi trường vào container Unity
          customParameters: -kpahBan ${{ needs.so-ban.outputs.pc }} ${{ inputs.pc_kieu != 'il2cpp' && '-kpahMono' || '' }}
      - name: Kiểm tra số bản trong bản build
        run: |
          ls build
          that=$(cat build/kpah-ban.txt 2>/dev/null || echo "?")
          echo "So ban trong ban build: $that, can: ${{ needs.so-ban.outputs.pc }}"
          if [ "$that" != "${{ needs.so-ban.outputs.pc }}" ]; then
            echo "::error::Ban build mang so $that, khac ${{ needs.so-ban.outputs.pc }} - KHONG phat hanh (client se cap nhat lap lai)"
            exit 1
          fi
      - name: Nén zip
        run: |
          python -I phat-hanh/nen-zip.py build/StandaloneWindows64 NQSH-H2-PC-${{ needs.so-ban.outputs.pc }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pc
          path: NQSH-H2-PC-${{ needs.so-ban.outputs.pc }}.zip
          retention-days: 3

  day-len:
    name: Đẩy lên GitHub Releases
    needs: [so-ban, android, jar, pc]
    # bản nào build xong thì phát hành bản đó (bản lỗi / không chọn thì không có file, bỏ qua);
    # job vẫn báo lỗi ở bước cuối nếu có bản build hỏng để bạn thấy
    if: ${{ !cancelled() && needs.so-ban.result == 'success' && !inputs.chi_build }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ra
      - name: Đẩy lên + ghi phienban.json (lần lượt từng bản)
        env:
          GH_TOKEN: ${{ secrets.NQSH_TAI_TOKEN }}
          GHI_CHU: ${{ inputs.ghi_chu }}
        run: |
          ls -R ra
          day() {  # <loai> <ban> <file>: chỉ đẩy bản đã build trong lần chạy này
            if [ -f "$3" ]; then sh phat-hanh/day-len.sh "$1" "$2" "$3" "$GHI_CHU"; fi
          }
          day jar ${{ needs.so-ban.outputs.jar }} ra/jar/NQSH-H2-v${{ needs.so-ban.outputs.jar }}.jar
          day android ${{ needs.so-ban.outputs.android }} ra/android/NQSH-H2-${{ needs.so-ban.outputs.android }}.apk
          day pc ${{ needs.so-ban.outputs.pc }} ra/pc/NQSH-H2-PC-${{ needs.so-ban.outputs.pc }}.zip
      - name: Bản build lỗi (nếu có)
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::Co ban build loi (android=${{ needs.android.result }}, jar=${{ needs.jar.result }}, pc=${{ needs.pc.result }}) - ban do KHONG duoc phat hanh"
          exit 1

[package]
name = "peerova-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "P2P tunnel core: NAT traversal, hole punching, wire protocol (zero third-party deps)"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
# TLS for the website relay fallback (WebSocket over HTTPS). Audited, pure-Rust TLS on ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# ---- TINH NANG NGUOI CHOI THUONG (KichBanTinhNangThuong, 29/10/2026): tinh nang truoc chi kiem bang GM / chua kiem, nay do
# nguoi choi THUONG (kt101.., nhan vat moi) choi bang goi tin client; GM chi dung canh nham ten / nham quai (smn, slv, ait,
# hoangda, mc, tua) + CSDL luc da thoat (vi tri luu, buoc nha tre, Hop PC co san). Bat bien: xu / bong / con / trung / mon dung
# (CSDL sau thoat), dang nhap lai giu nguyen, may chu con tra loi, khong Exception moi (-Dlog).
#   tn_pokemon : mua bong Chansey (gia menu, bam dup), ra dong, quai thuong tu choi, giao chien + nem toi khi bat, bong tru
#                dung so lan nem, Hop PC + Pokedex "Da bat" (goi + CSDL), theo / tha / tha lai; trao doi Pokemon hai nguoi
#                (moi, dat, khoa, tha khi dang dua bi chan, xac nhan dup, CSDL 1-1, khoa 24 gio); nha tre (phi chua gui,
#                gui, phi dung menu + 1 lan / ngay, de trung, IV, sap no, no dup, CSDL, vut het pet thi KHONG de - LOI THAT
#                da sua); ve mo o thu (mua, thieu luong, dung dup, vao lai). ~9 phut.
#   tn_he_thong: cho do hai nguoi (so du vua dung gia, xac nhan dup, mua lai tin da ban, thue, CSDL), bang (tao vua du
#                100 trieu, tao lai, moi / chat / roi, CSDL), doi khu (khu sai, xa bien, trung khu, hoi chieu 20 giay),
#                ngay moi (Ve lang 1 luot / ngay, nhiem vu tuan 2 / tuan, TUA dong ho ao toi thu Hai 05:01 -> dat lai,
#                vao lai khong them luot). Tua dong ho = nhom CUOI cua phan nay. ~11 phut.
tn_pokemon        cn  KichBanTinhNangThuong 900   -Dban=915  --  tn_bat tn_trao_doi tn_nha_tre tn_o_thu
tn_he_thong       cn  KichBanTinhNangThuong 900   -Dban=915  --  tn_cho tn_bang tn_khu tn_ngay_moi


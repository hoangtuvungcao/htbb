# ---- THAO TAC BAT THUONG (KichBanBatThuong, 25/10/2026): nguoi choi THUONG (kt101.., khong GM; GM chi chuan bi smn/spt/
# gem/slv/die nham ten) bam dup / bam lien mua-ban-mac-dap, tui day, vua du / thieu 1 xu, rut mang giua mua-ban-doi map-
# giao dich-nang cap, dang nhap lai lien tuc + hai phien, giao dich rut do sau khi doi phuong khoa / xac nhan dup, hanh dong
# khi guc, goi tin sai / cut cho 34 lenh, doc thu. Bat bien: tien / thuoc / so mon bao toan (doi CSDL), khong ket trang thai,
# may chu con tra loi, khong Exception moi trong log (-Dlog). bt_tien (29/10/2026): ban thu da khoa, ghep ngoc vua du xu, kho
# 68/69 don dap, cho ky gui thieu 1 xu / vua du / xac nhan x3 (doi CSDL). ~14 phut.

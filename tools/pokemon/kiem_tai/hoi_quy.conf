# Bo hoi quy bot cho CONG KIEM (vps/staging/kiem-truoc-khi-len.sh -> chay_hoi_quy.sh).
#
# Moi dong mot NHOM:   ten  kieu  lop  gioi_han_giay  [-Dkhoa=gia_tri ...]  --  [doi so]
#   kieu cn : lop kieu BotChucNang - goi "java <lop> <host> <cong> <tien_to> [kich_ban ...]";
#             DAT khi ma thoat 0 VA dong "=== TONG: PASS n, FAIL 0" (BO QUA khong tinh la hong).
#   kieu bt : BotBangThong - goi "java <lop> <host> <cong> <doi so>" (@TT@ = tien to bot); DAT khi "vao game N/N" va "loi=0".
#   Dong bat dau bang "!" = TAM TAT (ghi ly do ngay ben canh) - van in ra trong tong ket.
# chay_hoi_quy.sh tu them: -Ddb -Ddbtk -Ddbcnf|-Ddbport (tu <dbConn>), -Dnoi, -Dtu=1 -Dden=40 -DtuThuong=101
# -DdenThuong=199 (tai khoan bot GM <tt>001..040, thuong <tt>101..199 - vps/staging/lam-moi.sh tao), -Dra=<tep>.
# Chon nhom: HOI_QUY_NHOM="a b" (chi chay), HOI_QUY_BO="c d" (bo qua).
#
# GHI CHU cho nguoi mo rong (bao loi 24/10/2026): kich ban phai kiem bang nhan vat THUONG (BotChucNang.botThuong),
# GM chi dung de dung canh (slv / mto) - GM duoc mien khoa ban do va vai luat khac nen che mat loi nguoi choi gap.


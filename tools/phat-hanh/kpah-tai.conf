# /etc/apache2/conf-available/kpah-tai.conf  (cai bang phat-hanh/cai-dat-vps.sh)
# Ban phat hanh client (PC zip, APK) + phienban.json cho client tu cap nhat.
# Phuc vu thang tu dia, KHONG qua Node. Phai nap TRUOC kpah-web-proxy.conf
# (thu tu ten file: kpah-tai < kpah-web) de "ProxyPass /tai/ !" co hieu luc.
ProxyPass /tai/ !
Alias /tai/ /var/www/tai/
<Directory /var/www/tai>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Location /tai/phienban.json>
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</Location>
AddType application/vnd.android.package-archive .apk

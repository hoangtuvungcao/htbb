# /etc/apache2/conf-available/kpah-tai.conf  (cai bang phat-hanh/cai-dat-vps.sh)
# Ban phat hanh client (PC zip, APK) + phienban.json cho client tu cap nhat.
# Phuc vu thang tu dia, KHONG qua Node. Phai nap TRUOC kpah-web-proxy.conf
# (thu tu ten file: kpah-tai < kpah-web) de "ProxyPass /tai/ !" co hieu luc.
ProxyPass /tai/ !
Alias /tai/ /var/www/tai/
<Directory /var/www/tai>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Location /tai/phienban.json>
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</Location>
AddType application/vnd.android.package-archive .apk

# Link ngan de nguoi choi tu go (server game ghi san trong thong bao "co ban moi" cho jar):
# nqsh-h2.top/jar | /apk | /pc -> ban moi nhat tren GitHub Releases (kpah-server/nqsh-h2-tai).
ProxyPassMatch "^/(jar|apk|pc)/?$" !
RedirectMatch 302 "^/jar/?$" "https://github.com/kpah-server/nqsh-h2-tai/releases/download/jar/NQSH-H2.jar"
RedirectMatch 302 "^/apk/?$" "https://github.com/kpah-server/nqsh-h2-tai/releases/download/android/NQSH-H2.apk"
RedirectMatch 302 "^/pc/?$" "https://github.com/kpah-server/nqsh-h2-tai/releases/download/pc/NQSH-H2-PC.zip"

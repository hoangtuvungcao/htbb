# Phiên bản client Huyền Thoại Bảo Bối - MỘT chỗ cho cả jar / APK / PC (đưa lên git).
#   PHIEN_BAN: tên hiện cho người chơi (MANIFEST HTBB-Phien-Ban, Android versionName, CHANGELOG.md)
#   BAN      : số bản build nguyên, chỉ TĂNG = jar PhienBan.BAN (gửi khi đăng nhập, server sv.banToiThieu),
#              Android versionCode, PC bundleVersion (CapNhat.cs so với "pc.ban" trong phienban.json).
#              Quy ước: major*10000 + minor*100 + patch (0.9.0 -> 900, 0.9.1 -> 901, 1.0.0 -> 10000).
# MIDlet-Version của jar = phần số của PHIEN_BAN (0.9.0). Ra bản mới: sửa 2 dòng này + CHANGELOG.md.
# 0.9.7: MỌI bản công khai (cả vá nóng) có BAN mới lớn hơn; PHIEN_BAN 3 phần số khớp BAN (vá của 0.9.7 = 0.9.8 / 908).
# Phát hành: /admin/tai-game điền "Số bản" = BAN (máy chủ nhắc / bắt buộc cập nhật - docs/build.md).
PHIEN_BAN=0.9.11-opentest
BAN=911

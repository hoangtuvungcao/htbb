# /etc/nginx/sites-available/htbb - website HTBB (Nuxt 127.0.0.1:3000) sau WAF.
#   install -m 644 /opt/htbb/vps/htbb-nginx.conf /etc/nginx/sites-available/htbb
#   ln -sf /etc/nginx/sites-available/htbb /etc/nginx/sites-enabled/htbb && nginx -t && systemctl reload nginx

# ---- IP that cua khach tu WAF ----
# Dai IP egress cua WAF KHONG ghim trong git: khai tren VPS trong
# /etc/nginx/snippets/htbb-waf-ip.conf, moi dong mot "set_real_ip_from <CIDR>;"
# (lay dai IP tu nha cung cap WAF). Thieu tep -> nginx -t bao loi: tao tep rong neu chua co WAF.
include /etc/nginx/snippets/htbb-waf-ip.conf;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Scheme seen by the visitor: trust the WAF's X-Forwarded-Proto only when it is present.
map $http_x_forwarded_proto $htbb_proto {
    default $scheme;
    https   https;
    http    http;
}

upstream htbb_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Unknown Host / direct-IP hits: drop (do not reveal the site on the bare origin IP).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate     /etc/ssl/htbb/htbb-selfsigned.crt;
    ssl_certificate_key /etc/ssl/htbb/htbb-selfsigned.key;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    # Self-signed origin cert: only for the WAF -> origin leg if the WAF uses HTTPS to origin
    # ("full", non-strict). Replace with a real cert (certbot / WAF origin cert) later.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/ssl/htbb/htbb-selfsigned.crt;
    ssl_certificate_key /etc/ssl/htbb/htbb-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:htbb_ssl:5m;

    server_name huyenthoaibaoboi.fun www.huyenthoaibaoboi.fun;

    access_log /var/log/nginx/htbb.access.log;
    error_log  /var/log/nginx/htbb.error.log warn;

    # Game builds uploaded from /admin (~300 MB).
    client_max_body_size 350m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml application/manifest+json;

    server_tokens off;

    # Static downloads (game clients). Big binaries: no gzip, allow resume.
    location /downloads/ {
        alias /opt/htbb/downloads/;
        autoindex off;
        gzip off;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
        types {
            application/java-archive jar;
            application/vnd.android.package-archive apk;
            application/zip zip;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://htbb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr is already the real visitor IP (realip module above).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $htbb_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream large uploads to Node instead of buffering 300 MB on disk first.
        proxy_request_buffering off;
    }
}

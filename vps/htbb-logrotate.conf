# ============================================================
#  Xoay vong log cua HTBB - cai vao /etc/logrotate.d/htbb
#
#      sudo cp /opt/htbb/vps/htbb-logrotate.conf /etc/logrotate.d/htbb
#      sudo chown root:root /etc/logrotate.d/htbb
#      sudo chmod 644 /etc/logrotate.d/htbb
#      sudo logrotate -d /etc/logrotate.d/htbb    # chay thu, khong doi gi
#
#  Khong can cron: Ubuntu da co san logrotate.timer chay 00:00 moi ngay.
#  Kiem tra:  systemctl list-timers logrotate.timer
# ============================================================

# ------------------------------------------------------------
#  1. game.out / login.out - stdout+stderr do SYSTEMD ghi
#
#  BAT BUOC copytruncate. Ly do: htbb-game.service dung
#  "StandardOutput=append:/opt/htbb/log/game.out", systemd MO FILE MOT LAN
#  luc khoi dong roi giu nguyen fd do. Neu logrotate doi ten file (cach mac
#  dinh), systemd van ghi tiep vao file DA DOI TEN - file moi mai mai rong
#  con file cu van phinh to. copytruncate chep noi dung ra roi cat file goc
#  ve 0; fd mo bang O_APPEND nen lan ghi ke tiep tu quay ve dau file.
#
#  Danh doi: vai dong ghi trong khoang giua "chep xong" va "cat" co the mat.
#  Voi log stdout thi khong dang ke, va cach con lai la restart server.
# ------------------------------------------------------------
/opt/htbb/log/game.out
/opt/htbb/log/login.out
{
    daily
    rotate 30
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su htbb htbb
    # 0640 chu khong phai 0644: game.out tung chua mat khau CSDL (data.ConnPool in ra,
    # xem server/LocBiMat). Da chan o dau ra roi, nhung log van la cho de lo thu khac
    # nen khong de ai cung doc duoc. Nhom .txt ben duoi giu 0644 vi co cong cu khac doc.
    create 0640 htbb htbb
}

# ------------------------------------------------------------
#  2. Log cua cac script tren VPS (autodeploy.log, don-log.log, backup.log)
#     Do bash ghi bang >> nen doi ten file la an toan, khong can copytruncate.
# ------------------------------------------------------------
/opt/htbb/log/*.log {
    weekly
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    su htbb htbb
    # 0640 chu khong phai 0644: game.out tung chua mat khau CSDL (data.ConnPool in ra,
    # xem server/LocBiMat). Da chan o dau ra roi, nhung log van la cho de lo thu khac
    # nen khong de ai cung doc duoc. Nhom .txt ben duoi giu 0644 vi co cong cu khac doc.
    create 0640 htbb htbb
}

# ------------------------------------------------------------
#  3. File .txt server Java tu ghi ra thu muc goc
#
#  An toan tuyet doi khi doi ten: util.Logger (trong lib/htbb-core.jar) ghi bang
#  "new FileWriter(ten, true)" - MO LAI FILE MOI LAN GHI roi dong ngay. Doi ten
#  file di thi lan ghi sau tu tao lai file moi.
#
#  CO Y LIET KE TUNG FILE, khong dung /opt/htbb/server/*.txt. Vi trong cung thu muc do
#  co ba file server DOC NGUOC LAI nhu du lieu dau vao - xoay vong chung la mat
#  du lieu:
#      trangan.txt   src/data/Database.java   readText("trangan.txt")
#      offline.txt   src/data/Database.java   readText("offline.txt")
#      top.txt       src/real/MapChat.java    readText("top.txt")
#  (CO Y khong ghi so dong: so dong lech theo moi lan sua ma nguon - ba so cu o day
#   da tro sai het. Grep dung chuoi trong ngoac la ra ngay.)
#  Them file moi vao danh sach duoi day thi kiem lai: no chi duoc GHI, khong
#  duoc DOC o bat ky dau trong src/.
# ------------------------------------------------------------
/opt/htbb/server/hack.txt
/opt/htbb/server/hackdo.txt
/opt/htbb/server/errorlog.txt
/opt/htbb/server/errorAnima.txt
/opt/htbb/server/errorlogPet.txt
/opt/htbb/server/errorSellITem.txt
/opt/htbb/server/errorquayso.txt
/opt/htbb/server/savechar.txt
/opt/htbb/server/saitenchar4.txt
/opt/htbb/server/update.txt
/opt/htbb/server/updateleaf.txt
/opt/htbb/server/rUpdateleaf.txt
/opt/htbb/server/matketinfo.txt
/opt/htbb/server/nhantieu.txt
/opt/htbb/server/doitieu.txt
/opt/htbb/server/thetieu.txt
/opt/htbb/server/tratieu.txt
/opt/htbb/server/cuoptieu.txt
/opt/htbb/server/longden.txt
/opt/htbb/server/longdenchar.txt
/opt/htbb/server/longdendaylog.txt
/opt/htbb/server/datra4.txt
/opt/htbb/server/charWedding.txt

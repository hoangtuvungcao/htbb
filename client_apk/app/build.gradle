// Bản Android (KPAH 2.7.7 TeaMobi + mod NQSH-H2) build hoàn toàn từ source.
//   gradlew :app:assembleRelease -PkpahBan=1423 [-PkpahTen=NQSH-H2] [-PkpahKeyDir=...]
// Ký: thư mục KEY_DIR (hoặc -PkpahKeyDir) chứa key.properties (keystore=, alias=, password=) + keystore.
// Code mod dùng chung với bản J2ME (../../shared/mod) được port-android.py đổi tên lớp rồi đưa vào biên dịch.
plugins {
    id 'com.android.application'
}

def ban = (project.findProperty('kpahBan') ?: '1419') as int
def ten = project.findProperty('kpahTen') ?: 'NQSH-H2'
def keyDir = project.findProperty('kpahKeyDir') ?: System.getenv('KEY_DIR')
def khoa = new Properties()
if (keyDir && file("$keyDir/key.properties").exists()) {
    file("$keyDir/key.properties").withInputStream { khoa.load(it) }
}
def modSinh = layout.buildDirectory.dir('generated/kpah-mod/java')

android {
    namespace 'com.teamobi.kpah'
    compileSdk 36

    buildFeatures {
        resValues true
    }

    defaultConfig {
        applicationId 'com.nqsh.h2'
        minSdk 26
        targetSdk 35
        versionCode ban
        versionName '2.7.7'
        resValue 'string', 'app_name', ten
    }

    signingConfigs {
        release {
            if (khoa.getProperty('keystore')) {
                storeFile file("$keyDir/${khoa.getProperty('keystore')}")
                storePassword khoa.getProperty('password')
                keyAlias khoa.getProperty('alias')
                keyPassword khoa.getProperty('password')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig khoa.getProperty('keystore') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    sourceSets {
        main.java.srcDirs += modSinh
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.2.0'   // FileProvider (tự cập nhật APK)
}

// shared/mod (viết theo API J2ME) -> đổi tên lớp sang bản Android; sinh PhienBan (số bản gửi khi đăng nhập)
def chepModChung = tasks.register('chepModChung') {
    def vao = rootProject.file('../shared/mod/game/render/screen')
    def ra = modSinh.get().dir('game/render/screen').asFile
    inputs.dir(vao)
    inputs.file(rootProject.file('port-android.py'))
    inputs.property('ban', ban)
    outputs.dir(modSinh)
    doLast {
        delete(modSinh)
        ra.mkdirs()
        def py = System.getenv('PYTHON') ?: (org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'python' : 'python3')
        def kq = providers.exec {
            commandLine py, '-I', rootProject.file('port-android.py').absolutePath, vao.absolutePath, ra.absolutePath
        }
        println kq.standardOutput.asText.get().trim()
        new File(ra, 'PhienBan.java').text = """package game.render.screen;

/** Sinh bởi Gradle (chepModChung) - KHÔNG sửa tay. */
final class PhienBan {
    static final int BAN = ${ban};
}
"""
    }
}
tasks.named('preBuild') { dependsOn chepModChung }

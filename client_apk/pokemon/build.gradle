// APK Huyền Thoại Bảo Bối (Pokémon) = CODE BẢN JAR J2ME chạy trên lớp tương thích MIDP cho Android.
//   gradlew :pokemon:assembleDebug   [-PmayChu=host:cong] [-PhtbbBan=N]
//   gradlew :pokemon:assembleRelease [-PmayChu=host:cong] [-PhtbbKeyDir=... | -PhtbbKeyProps=<tệp .properties>]
//
// - Code game: ../../client_jar/src + ../../client_jar/shared/mod, chép + vá tối thiểu bởi ../port-j2me.py lúc build (một nguồn
//   duy nhất với bản jar; không sửa tay code sinh ra trong build/generated).
// - Lớp MIDP (javax.microedition.*) + Activity: src/main/java.
// - Tài nguyên: ../../client_jar/res (bản ĐẦY ĐỦ, không phải res_nhe) làm assets.
// - Server: bản debug mặc định nối server thử 10.0.2.2:19129 (máy chủ của máy ảo Android = 127.0.0.1 máy
//   dev), tên "Thử nghiệm". -PmayChu=host:cong (hoặc biến MAY_CHU) đổi server (cả release). Release BẮT BUỘC có
//   máy chủ: -PmayChu / MAY_CHU / MAY_CHU_CHINH / MAY_CHU_CHINH= trong ../tools/phat-hanh/may_chu.conf - thiếu là DỪNG.
// - Phiên bản: versionCode = -PhtbbBan hoặc BAN=, versionName = PHIEN_BAN= trong ../tools/phat-hanh/phien_ban.conf.
// - Ghi công: client_jar/res/GHI_CONG.txt (vào assets cùng res; màn "Ghi công" trong game, sinh bởi client_jar/tools/sinh_ghi_cong.py).
plugins {
    id 'com.android.application'
}

// KHOA=giatri trong ../tools/phat-hanh/<tep> (dòng cuối thắng; không có = null)
def docConf = { String tep, String khoa ->
    def f = rootProject.file("../tools/phat-hanh/$tep")
    def kq = null
    if (f.exists()) {
        f.eachLine('UTF-8') { dong ->
            def d = dong.trim()
            if (d.startsWith(khoa + '=')) kq = d.substring(khoa.length() + 1).trim().replace('"', '')
        }
    }
    return kq ? kq : null
}
def ban = (project.findProperty('htbbBan') ?: docConf('phien_ban.conf', 'BAN') ?: '1') as int
def phienBan = project.findProperty('phienBan') ?: System.getenv('PHIEN_BAN') ?: docConf('phien_ban.conf', 'PHIEN_BAN') ?: "1.$ban"
def mayChu = project.findProperty('mayChu') ?: System.getenv('MAY_CHU')
def mayChuRelease = mayChu ?: System.getenv('MAY_CHU_CHINH') ?: docConf('may_chu.conf', 'MAY_CHU_CHINH')
// Khoá ký release (luôn NGOÀI repo), một trong hai:
//   A) -PhtbbKeyProps=<tệp> hoặc biến HTBB_KEY_PROPERTIES=<tệp>: storeFile= (tuyệt đối hoặc tương đối với thư mục tệp),
//      storePassword=, keyAlias=, keyPassword= (thiếu = storePassword)
//   B) -PhtbbKeyDir / KEY_DIR chứa key.properties: keystore=, alias=, password=
def keyDir = project.findProperty('htbbKeyDir') ?: System.getenv('KEY_DIR')
def keyProps = project.findProperty('htbbKeyProps') ?: System.getenv('HTBB_KEY_PROPERTIES')
def khoa = new Properties()
if (keyProps) {
    def tk = new File(keyProps.toString())
    if (!tk.isFile()) throw new GradleException("HTBB_KEY_PROPERTIES / htbbKeyProps: khong thay tep $tk")
    if (tk.canonicalPath.startsWith(rootProject.file('..').canonicalPath + File.separator))
        throw new GradleException("Tep khoa $tk nam TRONG repo - chuyen ra ngoai repo")
    def k = new Properties()
    tk.withInputStream { k.load(it) }
    def sf = new File(k.getProperty('storeFile', ''))
    if (!sf.isAbsolute()) sf = new File(tk.parentFile, sf.path)
    keyDir = sf.parentFile.absolutePath
    khoa.setProperty('keystore', sf.name)
    khoa.setProperty('password', k.getProperty('storePassword', ''))
    khoa.setProperty('keyPassword', k.getProperty('keyPassword') ?: k.getProperty('storePassword', ''))
    khoa.setProperty('alias', k.getProperty('keyAlias', ''))
} else if (keyDir && file("$keyDir/key.properties").exists()) {
    file("$keyDir/key.properties").withInputStream { khoa.load(it) }
}
// nhanh p2p: ticket Peerova (-Pp2pTicket / P2P_TICKET / P2P_TICKET_FILE=<ticket.txt cua may chu>) -> game noi QUA P2P
// (JNI libpeerova_jni.so tu ../p2p/out/dist/android/<abi>/ - sh p2p/build/build-peerova.sh android). Loi P2P khong lui ve TCP.
def p2pTicket = project.findProperty('p2pTicket') ?: System.getenv('P2P_TICKET')
if (!p2pTicket && System.getenv('P2P_TICKET_FILE')) p2pTicket = new File(System.getenv('P2P_TICKET_FILE')).text.trim()
if (p2pTicket && !p2pTicket.toString().startsWith('pvt_')) throw new GradleException("P2P_TICKET phai bat dau bang pvt_")
def p2pNative = rootProject.file('../p2p/out/dist/android')
if (p2pTicket && !new File(p2pNative, 'arm64-v8a/libpeerova_jni.so').isFile())
    throw new GradleException("P2P: thieu $p2pNative/<abi>/libpeerova_jni.so - chay sh p2p/build/build-peerova.sh android")
def j2me = rootProject.file('../client_jar')
def codeSinh = layout.buildDirectory.dir('generated/htbb-j2me/java')
def tsDebug = layout.buildDirectory.dir('generated/htbb-thuoc-tinh/debug')
def tsRelease = layout.buildDirectory.dir('generated/htbb-thuoc-tinh/release')

android {
    namespace 'com.htbb.pokemon'
    compileSdk 36

    defaultConfig {
        applicationId 'com.htbb.pokemon'
        minSdk 26
        targetSdk 35
        versionCode ban
        versionName phienBan
    }

    signingConfigs {
        release {
            if (khoa.getProperty('keystore')) {
                storeFile file("$keyDir/${khoa.getProperty('keystore')}")
                storePassword khoa.getProperty('password')
                keyAlias khoa.getProperty('alias')
                keyPassword khoa.getProperty('keyPassword') ?: khoa.getProperty('password')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.thu'
            versionNameSuffix '-thu'
        }
        release {
            // code game tìm lớp theo tên (Class.forName("game.GameMidlet")) và dịch ngược: không thu gọn
            minifyEnabled false
            signingConfig khoa.getProperty('keystore') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    sourceSets {
        main.java.srcDirs += codeSinh
        // Java SE dùng chung PC + APK (bộ cập nhật htbb.capnhat - tải + SHA-256); không vào bản jar J2ME
        main.java.srcDirs += rootProject.file('../client_jar/shared/se')
        main.assets.srcDirs += new File(j2me, 'res')
        // key art HD chỉ cho APK (assets /bn/hd/: cảnh 880x400 + mây + khung + logo 240 px - client_jar/tools/tao_banner.py);
        // Banner.java (code jar) thấy /bn/hd/nen.png thì vẽ đúng khung hình key art, jar J2ME không có -> dải lớp nhỏ
        def banner = rootProject.file('../client_jar/shared/banner/res')
        if (banner.isDirectory()) main.assets.srcDirs += banner
        if (p2pTicket) main.jniLibs.srcDirs += p2pNative
        debug.assets.srcDirs += tsDebug
        release.assets.srcDirs += tsRelease
    }

    androidResources {
        // ảnh png của game đã nén sẵn; dữ liệu nhỏ - để nguyên cho AssetManager đọc nhanh
        noCompress += ['png', 'bin', 'dl']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-nowarn', '-XDsuppressNotes']
    options.deprecation = false
}

// client_jar/src + client_jar/shared/mod -> build/generated/htbb-j2me/java (port-j2me.py)
def portJ2me = tasks.register('portJ2me') {
    def vaoSrc = new File(j2me, 'src')
    def vaoMod = rootProject.file('../client_jar/shared/mod')
    def script = rootProject.file('port-j2me.py')
    inputs.dir(vaoSrc)
    inputs.dir(vaoMod)
    inputs.file(script)
    inputs.property('ban', ban)
    outputs.dir(codeSinh)
    doLast {
        def ra = codeSinh.get().asFile
        ra.mkdirs()
        def py = System.getenv('PYTHON') ?: (org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'python' : 'python3')
        def kq = providers.exec {
            commandLine py, '-I', script.absolutePath, vaoSrc.absolutePath, vaoMod.absolutePath, ra.absolutePath, "$ban"
        }
        println kq.standardOutput.asText.get().trim()
    }
}

// thuộc tính MANIFEST của bản jar (MIDlet.getAppProperty) + server theo kiểu build -> assets/htbb-app.properties
def thuocTinh = { String kieu, File ra ->
    def p = new Properties()
    new File(j2me, 'MANIFEST.MF').eachLine('UTF-8') { dong ->
        int i = dong.indexOf(':')
        if (i > 0) p.setProperty(dong.substring(0, i).trim(), dong.substring(i + 1).trim())
    }
    def mc = kieu == 'debug' ? (mayChu ?: '10.0.2.2:19129') : mayChuRelease
    if (mc) p.setProperty('HTBB-May-Chu', mc.toString())
    // như build.sh của jar: MIDlet-Version = phần số của phiên bản, HTBB-Phien-Ban / HTBB-Ban cho màn ghi công
    def so = (phienBan =~ /^(\d+\.\d+(\.\d+)?)/)
    if (so.find()) p.setProperty('MIDlet-Version', so.group(1))
    p.setProperty('HTBB-Phien-Ban', phienBan.toString())
    p.setProperty('HTBB-Ban', ban.toString())
    if (kieu == 'debug') p.setProperty('HTBB-Ban-Thu', '1')
    if (p2pTicket) p.setProperty('HTBB-P2P-Ticket', p2pTicket.toString())
    if (p2pTicket && System.getenv('P2P_TOKEN')) p.setProperty('HTBB-P2P-Token', System.getenv('P2P_TOKEN'))
    ra.mkdirs()
    new File(ra, 'htbb-app.properties').withWriter('UTF-8') { w -> p.store(w, 'Sinh boi Gradle (pokemon/build.gradle) - KHONG sua tay') }
}
def thuocTinhDebug = tasks.register('thuocTinhDebug') {
    inputs.file(new File(j2me, 'MANIFEST.MF'))
    inputs.property('mayChu', (mayChu ?: '').toString())
    inputs.property('p2pTicket', (p2pTicket ?: '').toString())
    inputs.property('phienBan', phienBan.toString())
    inputs.property('ban', ban)
    outputs.dir(tsDebug)
    doLast { thuocTinh('debug', tsDebug.get().asFile) }
}
def thuocTinhRelease = tasks.register('thuocTinhRelease') {
    inputs.file(new File(j2me, 'MANIFEST.MF'))
    inputs.property('mayChu', (mayChuRelease ?: '').toString())
    inputs.property('p2pTicket', (p2pTicket ?: '').toString())
    inputs.property('phienBan', phienBan.toString())
    inputs.property('ban', ban)
    outputs.dir(tsRelease)
    doLast { thuocTinh('release', tsRelease.get().asFile) }
}
tasks.named('preBuild') { dependsOn portJ2me, thuocTinhDebug, thuocTinhRelease }

// Bản phát hành phải gắn máy chủ production
def kiemMayChuRelease = tasks.register('kiemMayChuRelease') {
    doLast {
        def mc = (mayChuRelease ?: '').toString()
        if (!(mc ==~ /^[^:\s]+:\d+$/)) {
            throw new GradleException("APK release can may chu production host:cong (hien tai: '$mc'). Dat -PmayChu=host:cong " +
                "(build-pokemon.sh: MAY_CHU=host:cong), bien MAY_CHU_CHINH, hoac MAY_CHU_CHINH= trong tools/phat-hanh/may_chu.conf " +
                "(cp tools/phat-hanh/may_chu.conf.example tools/phat-hanh/may_chu.conf).")
        }
        // Rao chan: "nqsh-h2" la ten mien server cu cua game goc - giu chuoi de con nhan ra va tu choi.
        if (mc.contains('nqsh-h2')) {
            throw new GradleException("May chu '$mc' la server cu cua game goc - khong build APK HTBB")
        }
        println "HTBB release: may chu $mc, phien ban $phienBan ($ban)"
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn kiemMayChuRelease }

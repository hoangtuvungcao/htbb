<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Baloo 2","Nunito",system-ui,sans-serif}
  body{background:linear-gradient(180deg,#8fd0ff,#e6f6ff 70%);position:relative}
  .sun{position:absolute;right:90px;top:60px;width:120px;height:120px;border-radius:50%;background:#ffe04a;box-shadow:0 0 0 18px rgba(255,224,74,.25)}
  .hill{position:absolute;left:-10%;right:-10%;bottom:120px;height:180px;background:#a5dc7d;border-radius:50% 50% 0 0}
  .grass{position:absolute;inset:auto 0 0 0;height:150px;background:#78c850}
  h1{position:absolute;left:70px;top:70px;margin:0;font-size:96px;line-height:1;font-weight:800;color:#ffcb05;-webkit-text-stroke:14px #22508f;paint-order:stroke fill;text-shadow:0 8px 0 #00213f;max-width:760px}
  p{position:absolute;left:74px;top:300px;margin:0;font-size:34px;font-weight:700;color:#142a4a;background:#fff;border:5px solid #1b2a44;border-radius:18px;padding:12px 24px}
  .row{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;align-items:flex-end;gap:40px}
  .sp{display:inline-block;image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0}
  .tag{position:absolute;right:60px;bottom:24px;font-size:24px;font-weight:800;color:#fff;background:#e3350d;border:4px solid #1b2a44;border-radius:999px;padding:4px 18px}
</style></head>
<body><div class="sun"></div><div class="hill"></div><div class="grass"></div>
<h1>{{TEN}}</h1>
<p>Bạn không huấn luyện Pokémon — bạn chính là Pokémon!</p>
<div class="row">{{SPRITES}}</div>
<div class="tag">MMORPG · Miễn phí · Không nạp tiền</div>
</body></html>

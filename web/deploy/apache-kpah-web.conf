# /etc/apache2/conf-available/kpah-web-proxy.conf
#
# Chuyen tiep toan bo website ve Node (kpah-web.service, 127.0.0.1:3000).
# Moi lop bao ve dang co cua Apache VAN GIU NGUYEN vi Apache van dung truoc:
#   - mod_remoteip (khoi phuc IP that sau Nova WAF): mod_proxy ghi IP DA khoi phuc
#     vao cuoi X-Forwarded-For; Node lay phan tu cuoi do (server/utils/ip.ts).
#   - Whitelist IP (vps/chi-cho-server-txt.sh), Basic Auth cho /admin
#     (vps/mat-khau-admin.sh), ep HTTPS cho /admin (vps/bat-https.sh): cac luat
#     <Location> do van ap dung truoc khi ProxyPass chuyen di.
#
# Bat:  sudo a2enmod proxy proxy_http headers
#       sudo cp deploy/apache-kpah-web.conf /etc/apache2/conf-available/kpah-web-proxy.conf
#       sudo a2enconf kpah-web-proxy && sudo apachectl configtest && sudo systemctl reload apache2
# Go:   sudo a2disconf kpah-web-proxy && sudo systemctl reload apache2   (Apache tra ve website cu ngay)
#
# LUU Y: <Directory /opt/kpah/web> + "Require ..." cua chi-cho-server-txt.sh gan voi
# THU MUC tren dia, khong ap dung cho request da proxy. Chuyen cac luat do sang
# <Location /> (giu nguyen noi dung Require) truoc khi bat file nay, neu khong
# website se mo cho tat ca moi nguoi.
#
# LUU Y 2: Basic Auth chi dat cho <Location /admin> (trang HTML). KHONG dat cho
# /api/admin: API admin dung header "Authorization: Bearer <token>", trung header
# voi Basic Auth nen se bi Apache tu choi. Quyen that cua API admin do Node kiem
# (token admin + KPAH_ADMIN_ACCOUNTS), Basic Auth chi la lop chan them o ngoai.

ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 60

# Client game doc /server.txt va /server/NQSH2.txt - Nuxt phuc vu tu public/.
ProxyPass        / http://127.0.0.1:3000/ retry=0
ProxyPassReverse / http://127.0.0.1:3000/

# Ung dung tu bao proto that cho cookie/redirect (khong dung cookie, nhung giu cho dung).
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
